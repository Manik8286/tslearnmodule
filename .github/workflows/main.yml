name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION:     us-east-1
  ECR_REPOSITORY: tsk-image
  TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}

jobs:
  # -------------------------------------------------------
  # Job 1: Build and Push Docker image to ECR
  # Only runs on push to main (not on pull requests)
  # -------------------------------------------------------
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_url: ${{ steps.build.outputs.image_url }}   # pass image URL to terraform job

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}   # use git commit SHA as image tag
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./backend

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Pass the image URL as output to the terraform job
          echo "image_url=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # -------------------------------------------------------
  # Job 2: Terraform
  # Plan runs on PR, Apply runs on push to main (after docker job)
  # -------------------------------------------------------
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [docker]   # wait for docker job to finish first
    if: always()      # run even if docker job was skipped (for PRs)

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var="app_image=${{ needs.docker.outputs.image_url || 'public.ecr.aws/docker/library/python:3.12-slim' }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/gitmodule' && github.event_name == 'push'
        run: terraform apply -auto-approve -var="app_image=${{ needs.docker.outputs.image_url }}"
