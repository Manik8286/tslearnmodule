on:
  push:
    branches:
      - gitmodule
  pull_request:
    branches:
      - gitmodule

jobs:
  # -------------------------------------------------------
  # Job 1: Terraform — creates all infra including ECR
  # -------------------------------------------------------
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    if: always()

    outputs:
      ecr_url: ${{ steps.tf_output.outputs.ecr_url }}   # pass ECR URL to docker job

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var="app_image=public.ecr.aws/docker/library/python:3.12-slim"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/gitmodule' && github.event_name == 'push'
        run: terraform apply -auto-approve -var="app_image=public.ecr.aws/docker/library/python:3.12-slim"

      - name: Get ECR URL
        id: tf_output
        if: github.ref == 'refs/heads/gitmodule' && github.event_name == 'push'
        run: echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

  # -------------------------------------------------------
  # Job 2: Docker — build and push after ECR is created
  # -------------------------------------------------------
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [terraform]   # wait for terraform to finish
    if: github.ref == 'refs/heads/gitmodule' && github.event_name == 'push'

    outputs:
      image_url: ${{ steps.build.outputs.image_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_url=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # -------------------------------------------------------
  # Job 3: Update ECS with new image
  # -------------------------------------------------------
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [docker]   # wait for docker push to finish
    if: github.ref == 'refs/heads/gitmodule' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Update ECS with new image
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="app_image=${{ needs.docker.outputs.image_url }}"